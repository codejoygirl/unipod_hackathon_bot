# Local infrastructure and (later) full stack orchestration.
#
# Laravel local DX uses Sail: backend/compose.yaml → ./vendor/bin/sail up
# Do not run Sail DB/Redis and this file's postgres/redis on the same ports together.
#
# Planned app services (Dockerfiles in Phase 7):
#   frontend, backend, backend-queue, backend-scheduler, ai-service

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-community_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-community}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-community}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-community} -d ${POSTGRES_DB:-community_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
